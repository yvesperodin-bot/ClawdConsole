# Safe Haven — nginx reverse proxy
#
# Replace reflection.example.com with your real hostname, then:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/safe-haven
#   sudo ln -s /etc/nginx/sites-available/safe-haven /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d reflection.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app listens on 127.0.0.1:3000 only; nginx terminates TLS in front of it.

# Submissions are rate limited in the app as well; this is a cheap outer guard
# so abusive traffic never reaches Node.
limit_req_zone $binary_remote_addr zone=safehaven_api:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name reflection.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reflection.example.com;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/reflection.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reflection.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reports are text only; nothing large is ever uploaded.
    client_max_body_size 512k;

    access_log /var/log/nginx/safe-haven.access.log;
    error_log  /var/log/nginx/safe-haven.error.log;

    location /api/ {
        limit_req zone=safehaven_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generating the PDF and handing it to Zoho can take a few seconds.
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
